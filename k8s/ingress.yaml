# Public exposure. cert-manager sees this Ingress and issues the certificate itself.
#
# Domain: api.cubesnail.ca (dev — yes, "api" for the dev environment is a little odd,
# that's just what got picked). The main/prod branch's copy of this file uses
# app.cubesnail.ca instead — the two branches deploy different Ingress content
# deliberately, since this app's dev/prod environments use different hostnames (unlike
# the rest of k8s/, which stays identical across branches).
#
# DNS confirmed pointing at the house's public IP (2026-09-09) — listed in
# kustomization.yaml.
#
# Renaming this Ingress silently breaks renewal: the Certificate is owned by the Ingress
# that requested it, so deleting one garbage-collects the Certificate while the TLS Secret
# survives, and a new Ingress refuses to adopt it. After any rename, delete the orphaned
# Secret too and let cert-manager reissue.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rockon
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [api.cubesnail.ca]
      secretName: rockon-tls
  rules:
    - host: api.cubesnail.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rockon
                port: { number: 80 }
